[package]
name = "renamancer"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
renombrador-core = { path = "../core" }
serde = { version = "1", features = ["derive", "rc"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
